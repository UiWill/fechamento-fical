<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
<title>Configurar Agente Fiscal</title>
<style>
  :root {
    --void: #0a0a0a;
    --surface: #141414;
    --surface-2: #1b1b1a;
    --border: #2a2a28;
    --paper: #f5f5f3;
    --muted: #8a8a85;
    --muted-2: #56564f;
    --accent: #f5f5f3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--void);
    color: var(--paper);
    font-family: -apple-system, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-user-select: none;
  }
  header {
    padding: 1.5rem 1.75rem 1rem;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 600;
  }
  header p {
    margin: 0.3rem 0 0;
    font-size: 0.8rem;
    color: var(--muted);
    line-height: 1.5;
  }
  main {
    flex: 1;
    padding: 1.5rem 1.75rem;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    overflow-y: auto;
  }
  label {
    display: block;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }
  textarea, .campo-pasta {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--paper);
    font-size: 0.85rem;
    padding: 0.65rem 0.75rem;
    font-family: inherit;
    resize: none;
  }
  textarea { height: 4.5rem; }
  textarea:focus, .campo-pasta:focus { outline: none; border-color: var(--muted); }
  .linha-pasta {
    display: flex;
    gap: 0.5rem;
  }
  .campo-pasta {
    flex: 1;
    display: flex;
    align-items: center;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .campo-pasta.preenchido { color: var(--paper); }
  button {
    font-family: inherit;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--paper);
    font-size: 0.8rem;
    padding: 0.6rem 1rem;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.4; cursor: default; }
  button.principal {
    background: var(--paper);
    color: var(--void);
    border: none;
    font-weight: 600;
  }
  .mensagem {
    font-size: 0.78rem;
    line-height: 1.5;
    padding: 0.6rem 0.75rem;
    border-radius: 6px;
    display: none;
  }
  .mensagem.erro { display: block; background: #2a1414; color: #f0a8a8; }
  .mensagem.ok { display: block; background: #142a16; color: #a8e0ae; }
  footer {
    padding: 1.1rem 1.75rem;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 0.6rem;
  }
  .spinner {
    display: inline-block;
    width: 0.8rem;
    height: 0.8rem;
    border-radius: 50%;
    border: 2px solid rgba(0,0,0,0.25);
    border-top-color: var(--void);
    animation: girar 0.7s linear infinite;
    vertical-align: -1px;
    margin-right: 0.4rem;
  }
  @keyframes girar { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <header>
    <h1>Configurar Agente Fiscal</h1>
    <p>Cole o código de instalação gerado no painel e escolha a pasta onde as notas de saída (NF-e/NFC-e/CT-e) são salvas.</p>
  </header>
  <main>
    <div>
      <label for="token">Código de instalação</label>
      <textarea id="token" placeholder="Cole aqui o código gerado em Agentes Desktop → Gerar token"></textarea>
      <div id="msg-token" class="mensagem"></div>
    </div>
    <div>
      <label>Pasta das notas de saída</label>
      <div class="linha-pasta">
        <div id="pasta-selecionada" class="campo-pasta">Nenhuma pasta selecionada</div>
        <button id="btn-escolher-pasta">Escolher pasta…</button>
      </div>
    </div>
  </main>
  <footer>
    <button id="btn-concluir" class="principal" disabled>Concluir configuração</button>
  </footer>
  <script src="setup.js"></script>
</body>
</html>
