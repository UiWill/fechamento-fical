# Ambiente de desenvolvimento local. Roda a partir da raiz do repositório:
#   docker compose -f infra/docker-compose.yml up
# Sobe Postgres, Redis, MinIO e os 3 apps. Em dev, os apps usam bind mount +
# hot reload em vez da imagem de produção (ver Dockerfile de cada app).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-afe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque-esta-senha}
      POSTGRES_DB: ${POSTGRES_DB:-afe}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-afe}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-afe-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-troque-esta-senha-tambem}
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # console web
    volumes:
      - miniodata:/data

  fiscal-engine:
    build:
      context: ..
      dockerfile: apps/fiscal-engine/Dockerfile
    restart: unless-stopped
    environment:
      FISCAL_ENGINE_PORT: 3100
      ACBR_AMBIENTE: ${ACBR_AMBIENTE:-2}
    ports:
      - "3100:3100"

  core-api:
    build:
      context: ..
      dockerfile: apps/core-api/Dockerfile
    restart: unless-stopped
    environment:
      CORE_API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-afe}:${POSTGRES_PASSWORD:-troque-esta-senha}@postgres:5432/${POSTGRES_DB:-afe}?schema=public
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-afe-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-troque-esta-senha-tambem}
      FISCAL_ENGINE_URL: http://fiscal-engine:3100
      CERT_MASTER_KEY: ${CERT_MASTER_KEY:?defina CERT_MASTER_KEY no .env}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      fiscal-engine:
        condition: service_started

  admin-web:
    build:
      context: ..
      dockerfile: apps/admin-web/Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      PORT: 3000
    ports:
      - "3200:3000"
    depends_on:
      - core-api

volumes:
  pgdata:
  redisdata:
  miniodata:
