# Configuração estática do Traefik — VPS dedicada deste projeto (sem
# depender do Traefik/rede de nenhum outro projeto seu).
api:
  dashboard: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false
    network: afe_public

certificatesResolvers:
  letsencrypt:
    acme:
      # E-mail definido via flag de comando no docker-compose.prod.yml, não
      # aqui — arquivos estáticos do Traefik não interpolam variáveis de
      # ambiente.
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

log:
  level: INFO
